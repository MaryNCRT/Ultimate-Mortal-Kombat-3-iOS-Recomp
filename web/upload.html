<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Cargar IPA de UMK3 al workspace</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { margin: 0; padding: 2rem 1rem; background: #161616; color: #eee; }
    main { max-width: 42rem; margin: 0 auto; }
    button { padding: .7rem 1rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 3rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Transferir IPA al workspace</h1>
    <p>Elige el archivo IPA de tu copia legal. Se transferirá directamente a este
       workspace y se guardará en <code>IPA/UMK3.ipa</code>, que está excluido de Git.
       No se enviará a Archive.org ni a otro servicio.</p>
    <button id="choose" type="button">Elegir archivo IPA</button>
    <input id="ipa" type="file" accept=".ipa,.zip,application/zip,application/octet-stream,*/*" hidden>
    <p id="status" role="status">Todavía no se ha seleccionado ningún archivo.</p>
  </main>
  <script>
    const token = "__UPLOAD_TOKEN__";
    const chooser = document.getElementById("choose");
    const input = document.getElementById("ipa");
    const status = document.getElementById("status");

    chooser.addEventListener("click", () => input.click());
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file)
        return;
      chooser.disabled = true;
      status.textContent = `Revisando ${file.name} (${(file.size / 1048576).toFixed(1)} MiB)...`;
      if (file.size < 4) {
        chooser.disabled = false;
        status.textContent = "El archivo está vacío o es demasiado pequeño para ser un IPA.";
        return;
      }
      const signature = new Uint8Array(await file.slice(0, 4).arrayBuffer());
      const isZip = signature[0] === 0x50 && signature[1] === 0x4b &&
        ((signature[2] === 0x03 && signature[3] === 0x04) ||
         (signature[2] === 0x05 && signature[3] === 0x06));
      if (!isZip) {
        chooser.disabled = false;
        status.textContent = `${file.name} no parece ser un IPA ZIP (firma inicial no válida).`;
        return;
      }

      status.textContent = `Transfiriendo ${file.name} (${(file.size / 1048576).toFixed(1)} MiB) al workspace. Mantén esta página abierta...`;
      let uploadId = "";
      try {
        const startResponse = await fetch("/upload/start", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Upload-Token": token
          },
          body: JSON.stringify({ bytes: file.size })
        });
        const started = await readResponse(startResponse);
        uploadId = started.upload_id;

        const chunkSize = started.chunk_bytes;
        for (let offset = 0; offset < file.size; offset += chunkSize) {
          const chunk = file.slice(offset, Math.min(offset + chunkSize, file.size));
          const response = await fetch("/upload/chunk", {
            method: "POST",
            headers: {
              "Content-Type": "application/octet-stream",
              "X-Upload-Token": token,
              "X-Upload-ID": uploadId,
              "X-Upload-Offset": String(offset)
            },
            body: chunk
          });
          const result = await readResponse(response);
          status.textContent =
            `Transfiriendo al workspace: ${Math.floor(result.received * 100 / file.size)}% (${(result.received / 1048576).toFixed(1)} / ${(file.size / 1048576).toFixed(1)} MiB)...`;
        }

        const finishResponse = await fetch("/upload/finish", {
          method: "POST",
          headers: {
            "X-Upload-Token": token,
            "X-Upload-ID": uploadId
          }
        });
        const result = await readResponse(finishResponse);
        status.textContent = `Recibido correctamente: ${result.path} (${(result.bytes / 1048576).toFixed(1)} MiB).`;
      } catch (error) {
        chooser.disabled = false;
        status.textContent = "No se pudo transferir el archivo: " + error.message;
      }
    });

    async function readResponse(response) {
      const text = await response.text();
      let result;
      try {
        result = JSON.parse(text);
      } catch {
        const preview = text.replace(/\s+/g, " ").slice(0, 180);
        throw new Error(`El servidor/proxy respondió HTTP ${response.status} sin JSON${preview ? ": " + preview : "."}`);
      }
      if (!response.ok)
        throw new Error(result.error || `Error HTTP ${response.status}`);
      return result;
    }
  </script>
</body>
</html>
